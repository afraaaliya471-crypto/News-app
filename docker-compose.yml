# Flask + WhatsApp bot in one container (PM2). Code is bind-mounted at /app
# so git pull on the host is enough; restart the container, no image rebuild.
# Port 5050 is localhost only. 2g RAM cap so Chromium can't eat the box.
#
# First run only (installs land on the host via the mount):
#   docker compose run --rm newsapp bash -c "npm install && python3 -m venv .venv && .venv/bin/pip install -r requirements.txt"

services:
  newsapp:
    build: .
    container_name: newsapp
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5050:5050"
    mem_limit: 2g
    cpus: 1.0
