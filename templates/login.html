<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in - UAE & Saudi Construction News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light'); } catch (e) {}
</script>
<style>
  :root {
    --bg: #f3f4f8;
    --surface: #ffffff;
    --border: #e4e7ed;
    --text: #12141c;
    --muted: #667085;
    --brand: #2f4bdb;
    --brand-dark: #23399f;
    --danger: #b42318;
    --danger-soft: #fde8e8;
    --shadow-md: 0 8px 24px rgba(16,24,40,0.08);
  }
  [data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d29;
    --border: #2d3142;
    --text: #e4e7ed;
    --muted: #98a2b3;
    --danger: #fda29b;
    --danger-soft: #3b1511;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Inter", "Segoe UI", -apple-system, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px 28px;
    box-shadow: var(--shadow-md);
  }
  .brand-mark {
    width: 48px; height: 48px; border-radius: 13px;
    background: linear-gradient(145deg, var(--brand), var(--brand-dark));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(47,75,219,0.28);
    margin-bottom: 18px;
  }
  h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin: 0 0 6px; }
  input {
    width: 100%; font: inherit; font-size: 15px;
    padding: 11px 13px; margin-bottom: 16px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
  }
  input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
  button {
    width: 100%; font: inherit; font-size: 15px; font-weight: 700;
    padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--brand); color: #fff;
  }
  button:hover { background: var(--brand-dark); }
  .error {
    background: var(--danger-soft); color: var(--danger);
    font-size: 13px; font-weight: 600;
    padding: 10px 12px; border-radius: 10px; margin-bottom: 16px;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand-mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 21h18"/>
        <path d="M5 21V9l7-5 7 5v12"/>
        <path d="M9 21v-6h6v6"/>
        <path d="M9 12h.01M15 12h.01M12 9h.01"/>
      </svg>
    </div>
    <h1>UAE &amp; Saudi Construction News</h1>
    <p class="sub">Sign in to open the dashboard.</p>

    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
